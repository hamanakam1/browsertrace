<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>panther-intent-capture — Recordings</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<div class="shell">
  <header>
    <h1>panther-intent-capture</h1>
    <a href="popup/popup.html" class="btn">Open Extension</a>
  </header>

  <div class="card">
    <div class="card-header">
      <h2>Recordings</h2>
      <span id="count" class="badge">0</span>
    </div>
    <div id="empty" class="empty">No recordings yet. Start a recording from the extension popup.</div>
    <table id="recordingsTable" style="display:none">
      <thead>
        <tr>
          <th>Started</th><th>URL</th><th>Duration</th><th>Events</th><th>Inference</th><th>Video</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="recordingsBody"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 id="viewTitle">Recording</h2>
    </div>
    <div id="viewPanel" style="display:none">
      <div class="video-wrap">
        <video id="recVideo" controls preload="metadata" style="max-width:100%; max-height:400px; background:#000;"></video>
      </div>
      <div id="viewMeta" style="margin-top:10px; font-size:12px; color:#6b7280;"></div>
      <button class="btn btn-primary" onclick="app.closeView()">Close</button>
    </div>
    <div id="inferenceView" style="margin-top:16px; display:none">
      <h3 style="font-size:14px; margin:0 0 8px 0;">Inference</h3>
      <div id="inferenceMeta" style="font-size:12px; color:#6b7280; margin-bottom:8px;"></div>
      <pre id="inferenceBody"></pre>
    </div>
    <div id="inferenceEmpty" class="empty" style="margin-top:16px;">No inference result yet.</div>
  </div>

  <div class="footer">
    Local-first &middot; For self-improvement &amp; learning
  </div>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
