<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>panther-intent-capture — Record & Learn</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="shell">
  <div id="backendBanner" class="banner warn" style="display:none">
    Backend not reachable. Start it with <code>backend/start.sh</code>.
  </div>
  <div class="header">
    <h1>panther-intent-capture</h1>
    <div class="status" id="status">Idle</div>
  </div>

  <div class="card consent-card">
    <div class="consent-row">
      <input type="checkbox" id="consent" />
      <label for="consent">Enable recording &amp; inference on page usage</label>
    </div>
    <p class="note">Opt-in only. Works on any page you choose. Everything stays local.</p>
  </div>

  <div class="card control-card">
    <button id="recordBtn" class="btn" disabled>Start Recording</button>
    <button id="stopBtn" class="btn danger" disabled style="display:none">Stop Recording</button>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card log-card">
    <h3>Consent log</h3>
    <div id="log"></div>
  </div>

  <div class="footer">
    Local-first &middot; For self-improvement &amp; learning
  </div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
