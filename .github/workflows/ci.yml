name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend deps
        run: |
          pip install --upgrade pip

      - name: Run redaction unit tests (extension)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - run: deno test tests/redaction_test.mjs
        working-directory: .

      - name: Lint Python
        run: |
          python -m py_compile backend/server.py backend/api/routes.py backend/inference.py backend/storage.py backend/redaction.py
