<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background circle (subtle) -->
  <circle cx="100" cy="100" r="92" fill="#0f172a" opacity="0.95"/>

  <!-- Outer eye ring -->
  <path d="M100 30 C60 30 30 60 30 100 C30 140 60 170 100 170 C140 170 170 140 170 100 C170 60 140 30 100 30 Z"
        fill="none" stroke="url(#brand)" stroke-width="10" stroke-linecap="round"/>

  <!-- Pupil (the "observe" eye) -->
  <circle cx="100" cy="100" r="26" fill="#ffffff"/>

  <!-- Cursor dot -->
  <circle cx="100" cy="64" r="8" fill="#06b6d4"/>

  <!-- Trace trail sweeping from cursor to pupil -->
  <path d="M100 64 Q110 78 100 100" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Secondary trace line -->
  <path d="M100 100 Q85 115 100 130" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Glow -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="26" fill="#ffffff"/>
  </g>
</svg>
